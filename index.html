<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المقررات المسجلة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1C0910">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: one RTL column. Masthead with pulse line, live status panel, day tabs + vertical timeline, then a full weekly grid. */
:root{
  --font-display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --bg:#1C0910; --glow:rgba(158,36,68,.38);
  --surface:#2A111A; --surface2:#381722; --line:#5C2A39;
  --fg:#F7ECE9; --muted:#C9A6AB;
  --accent:#E9A9A4; --accent-ink:#2A0912; --ok:#9ADBB0;
  --k-theory:#F2A7A0; --k-practical:#D98FB5; --k-lab:#E8C48F; --k-workshop:#D48B6C; --k-lang:#B99AE3;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background-color:var(--bg);
  background-image:radial-gradient(60rem 26rem at 100% -6rem,var(--glow),transparent 65%);
  color:var(--fg); font-family:var(--font-body); font-size:16px; line-height:1.6; direction:rtl; margin:0;
}
button{font:inherit}
.wrap{
  max-width:60rem; margin-inline:auto; padding-block:1.5rem 3.5rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:1rem 2rem;padding-block:.5rem 1.6rem}
.eyebrow{font-size:.88rem;letter-spacing:.04em;color:var(--accent);font-weight:500;margin:0}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(2.5rem,10vw,4rem);line-height:1.1;margin:.2rem 0 .5rem;text-wrap:balance}
.date{color:var(--muted);margin:0}
.ecg{width:min(15rem,100%);height:auto;color:var(--accent);flex:none}

.status{border:1px solid var(--line);border-radius:1.25rem;background:linear-gradient(160deg,var(--surface2),var(--surface));padding:1.25rem 1.25rem 1.4rem;display:grid;gap:.65rem}
.status.live{border-color:var(--accent)}
.st-top{display:flex;align-items:center;gap:.6rem;font-size:.88rem;color:var(--muted)}
.st-label{color:var(--accent);font-weight:600;letter-spacing:.06em}
.st-time{margin-inline-start:auto}
.pulse{width:.6rem;height:.6rem;border-radius:50%;background:var(--muted);flex:none}
.live .pulse{background:var(--ok);animation:pulse 1.8s ease-out infinite}
.next .pulse{background:var(--accent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}100%{box-shadow:0 0 0 .7rem transparent}}
@media (prefers-reduced-motion:reduce){.live .pulse{animation:none}}
.st-title{font-family:var(--font-display);font-size:clamp(1.45rem,5.5vw,2.1rem);font-weight:600;line-height:1.3;margin:0;text-wrap:balance}
.st-meta{display:flex;flex-wrap:wrap;gap:.2rem 1.3rem;color:var(--muted);margin:0}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:inherit}

.controls{display:grid;gap:.9rem;margin-block:2rem .6rem}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:.4rem}
.tab{font-weight:500;font-size:.92rem;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:.8rem;padding:.7rem .2rem;cursor:pointer;position:relative}
.tab[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tab.today::after{content:"";position:absolute;top:.35rem;inset-inline-end:.35rem;width:.4rem;height:.4rem;border-radius:50%;background:var(--ok)}
.grp{display:flex;align-items:center;flex-wrap:wrap;gap:.6rem;color:var(--muted);font-size:.9rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:.2rem;gap:.15rem}
.seg button{border:0;background:transparent;color:var(--muted);padding:.3rem .9rem;border-radius:99px;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--fg);font-weight:600;box-shadow:0 0 0 1px var(--line) inset}
.tab:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.day-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.2rem 1rem;margin-block:1.2rem .4rem}
.day-h h2{font-family:var(--font-display);font-size:1.6rem;font-weight:600;margin:0}
.day-h p{margin:0;color:var(--muted);font-size:.9rem}

.tl{list-style:none;margin:0;padding:0}
.item{position:relative;display:grid;grid-template-columns:4.2rem minmax(0,1fr);gap:1.6rem;padding-block:.45rem}
.item::before{content:"";position:absolute;inset-block:0;inset-inline-start:calc(4.2rem + .8rem);width:1px;background:var(--line)}
.item.s::after{content:"";position:absolute;top:1.6rem;inset-inline-start:calc(4.2rem + .8rem - 5px);width:11px;height:11px;border-radius:50%;background:var(--k);box-shadow:0 0 0 4px var(--bg)}
.time{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;padding-top:.8rem;display:flex;flex-direction:column;line-height:1.35}
.time strong{font-size:1.08rem;font-weight:600}
.time span{font-size:.82rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:1rem;padding:.95rem 1.05rem 1.05rem;display:grid;gap:.5rem;min-width:0}
.live-item .card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.past .card,.past .time{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center}
.chip{font-size:.78rem;font-weight:600;color:var(--k);background:color-mix(in srgb,var(--k) 14%,transparent);padding:.12rem .65rem;border-radius:99px}
.chip.g{color:var(--muted);background:transparent;border:1px solid var(--line);font-weight:500}
.chip.now{background:var(--accent);color:var(--accent-ink)}
.card h3{font-family:var(--font-display);font-size:1.2rem;font-weight:600;line-height:1.4;margin:0;text-wrap:balance}
dl{margin:0;display:grid;gap:.2rem;font-size:.92rem}
dl div{display:flex;gap:.7rem}
dt{color:var(--muted);min-width:3.6rem;flex:none}
dd{margin:0;min-width:0}
.unsure{border-bottom:1px dashed var(--accent);cursor:help}
.gapnote{align-self:center;border:1px dashed var(--line);border-radius:.8rem;padding:.45rem 1rem;color:var(--muted);font-size:.86rem}
.empty{border:1px dashed var(--line);border-radius:1rem;padding:1.6rem 1rem;text-align:center;color:var(--muted)}

.sec-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:.4rem 1.2rem;margin-block:2.8rem .8rem}
.sec-h h2{font-family:var(--font-display);font-size:1.6rem;font-weight:600;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;color:var(--muted);font-size:.84rem}
.legend span::before{content:"";display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--k);margin-inline-end:.4rem}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:1.1rem;background:var(--surface);padding:.45rem}
table{border-collapse:separate;border-spacing:.3rem;min-width:56rem;width:100%;table-layout:fixed}
th{font-weight:500;color:var(--muted);font-size:.82rem;padding:.3rem}
th.day{text-align:right;color:var(--fg);font-weight:600;font-size:.95rem;width:5.6rem;padding-inline-end:.6rem}
tr.today th.day{color:var(--accent)}
.hr{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
td{vertical-align:top;height:3.8rem;border-radius:.7rem}
td.em{background:color-mix(in srgb,var(--surface2) 45%,transparent)}
td.ev{background:color-mix(in srgb,var(--k) 15%,var(--surface));border:1px solid color-mix(in srgb,var(--k) 38%,transparent);padding:.5rem .65rem;font-size:.82rem;line-height:1.45}
td.ev b{display:block;font-weight:600}
td.ev small{color:var(--muted);font-size:.78rem}

.foot{margin-top:2.6rem;color:var(--muted);font-size:.86rem;display:grid;gap:.4rem;border-top:1px solid var(--line);padding-top:1rem}
.foot p{margin:0}
.logo{background:#fff;border-radius:1rem;padding:.5rem .7rem;box-shadow:0 0 0 1px var(--line)}
.logo img{display:block;height:6.5rem;width:auto}
.brand{display:flex;flex-direction:column;align-items:center;gap:.9rem;padding:.6rem 0 0;text-align:center}
.brand .logo{padding:.7rem .9rem;border-radius:1.4rem;background:#fff;box-shadow:0 0 0 1px var(--accent),0 0 0 6px color-mix(in srgb,var(--accent) 18%,transparent),0 14px 34px -12px rgba(0,0,0,.35)}
.brand .logo img{height:7.2rem}
.brand-sub{font-family:var(--font-display);color:var(--accent);font-size:1.05rem;font-weight:500;letter-spacing:.06em}
.brand-to{direction:ltr;unicode-bidi:isolate;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:1.05rem;letter-spacing:.08em;color:var(--muted);margin-top:-.45rem}
.orn{display:flex;align-items:center;gap:.8rem;width:100%;margin:.2rem 0 1.4rem}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent))}
.orn::after{transform:scaleX(-1)}
.orn i{width:.55rem;height:.55rem;background:var(--accent);transform:rotate(45deg);flex:none}
.dev-line{text-align:center;margin-top:1.4rem!important;padding-top:1.2rem;border-top:1px solid var(--line)}
.dev-link{display:inline-flex;align-items:center;gap:.55rem;direction:ltr;font-weight:600;font-size:.98rem;color:var(--accent-ink);background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 70%,#fff));border-radius:99px;padding:.6rem 1.4rem;text-decoration:none;box-shadow:0 10px 24px -12px var(--accent)}
.dev-link svg{width:1.15rem;height:1.15rem;fill:currentColor}
.dev-link:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
</style>
</head>

    return p.join(' و ')||'أقل من دقيقة';
  }
  function visible(d){
    return EV.filter(function(e){return e.d===d;}).sort(function(a,b){return a.s-b.s;});

  function renderStatus(){

      }
      var isToday=sel===wd;
      var live=isToday&&mins>=e.s*60&&mins<e.e*60;
      var past=isToday&&mins>=e.e*60;
      var rows='<div><dt>'+(e.who.length>1?'المدرّسون':'المدرّس')+'</dt><dd>'+who(e)+'</dd></div>';
      if(e.room)rows+='<div><dt>القاعة</dt><dd>'+uns(e.room,e.rq)+'</dd></div>';
      rows+='<div><dt>المقرر</dt><dd><bdi>'+uns(e.code,e.cq)+'</bdi> · شعبة <bdi>'+e.sec+'</bdi></dd></div>';
      out.push('<li class="item s'+(live?' live-item':'')+(past?' past':'')+'" style="--k:var(--k-'+e.k+')">'+
        '<div class="time"><strong>'+hh(e.s)+'</strong><span>'+hh(e.e)+'</span></div>'+
        '<div class="card"><div class="chips"><span class="chip">'+KIND[e.k]+'</span>'+(e.gl?'<span class="chip g">'+e.gl+'</span>':'')+(live?'<span class="chip now">الآن</span>':'')+'</div>'+
        '<h3>'+e.t+'</h3><dl>'+rows+'</dl></div></li>');
      prev=e.e;
    });
    $('tl').innerHTML=out.join('');
  }

  function renderGrid(){
    var wd=di(new Date().getDay()), slots=[8,9,10,11,12,13,14,15];
    var head='<colgroup><col style="width:5.6rem">'+slots.map(function(){return '<col>';}).join('')+'</colgroup>'+
      '<thead><tr><th class="day">اليوم</th>'+slots.map(function(s){return '<th><span class="hr">'+String(s).padStart(2,'0')+'–'+String(s+1).padStart(2,'0')+'</span></th>';}).join('')+'</tr></thead>';
    var body=DAYS.map(function(n,d){
      var list=visible(d), cells=[], s=8;
      while(s<16){
        var e=list.filter(function(x){return x.s===s;})[0];
        if(e){
          var sub=e.room?uns(e.room,e.rq):(e.gl||'');
          cells.push('<td class="ev" colspan="'+(e.e-e.s)+'" style="--k:var(--k-'+e.k+')"><b>'+e.t+'</b><small>'+sub+'</small></td>');
          s=e.e;
        }else{cells.push('<td class="em"></td>');s+=1;}
      }
      return '<tr'+(d===wd?' class="today"':'')+'><th class="day" scope="row">'+n+'</th>'+cells.join('')+'</tr>';
    }).join('');
    $('grid').innerHTML=head+'<tbody>'+body+'</tbody>';
    var total=0; for(var d=0;d<DAYS.length;d++)visible(d).forEach(function(e){total+=e.e-e.s;});
    $('hours').textContent='مجموع الساعات المعتمدة: 16 · ساعات الدوام الأسبوعية: '+total;
  }

  $('legend').innerHTML=['theory','practical','lab','lang'].map(function(k){return '<span style="--k:var(--k-'+k+')">'+KIND[k]+'</span>';}).join('');

  $('tabs').addEventListener('click',function(ev){
    var b=ev.target.closest('.tab'); if(!b)return;
    sel=+b.getAttribute('data-d'); renderTabs(); renderDay();
  });

  sel=Math.max(0,di(new Date().getDay()));
  renderStatus(); renderTabs(); renderDay(); renderGrid();
  setInterval(function(){renderStatus(); renderDay();},30000);
})();
</script>

</body>
</html>
